<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TheDriiipStrainLibrary</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0a0a0a;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #39ff14;
    }
    h1 {
      color: #39ff14;
      text-shadow: 0 0 5px #39ff14;
      margin: 0;
    }
    .video-section, .comic-feed {
      padding: 30px 20px;
      text-align: center;
    }
    .video-section iframe, .comic-feed img {
      max-width: 100%;
      border: 2px solid #39ff14;
      border-radius: 8px;
      margin-top: 10px;
    }
    .comic-feed h2, .video-section h2 {
      color: #39ff14;
    }
    footer {
      background-color: #0a0a0a;
      padding: 20px;
      text-align: center;
      border-top: 3px solid #39ff14;
      position: relative;
      bottom: 0;
      width: 100%;
    }
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 10px 0;
    }
    .social-icons a {
      color: #39ff14;
      font-size: 24px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>TheDriiipStrainLibrary</h1>
  </header>

  <section class="video-section">
    <h2>Latest Drop</h2>
    <p>Check out the newest video from the strain vault.</p>
    <iframe
      src="https://www.youtube-nocookie.com/embed/M7lc1UVf-VE"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </section>

  <section class="comic-feed">
    <h2>This Week: GalactaWeed</h2>
    <p>The latest page from the cosmic chronicles.</p>
    <img src="comics/latest-comic.jpg" alt="GalactaWeed Comic" />
  </section>

  <footer>
    <div class="social-icons">
      <a href="https://instagram.com" target="_blank">IG</a>
      <a href="https://snapchat.com" target="_blank">SC</a>
      <a href="https://tiktok.com" target="_blank">TT</a>
      <a href="https://facebook.com" target="_blank">FB</a>
      <a href="https://reddit.com" target="_blank">RD</a>
    </div>
    <p>© 2026 TheDriiipStrainLibrary. All rights reserved.</p>
  </footer>
</body>
</html>
